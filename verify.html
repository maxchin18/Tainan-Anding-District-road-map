<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>驗收文件驗證｜安定區公眾通行道路圖資系統</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261008c">
<link rel="stylesheet" href="css/loop.css?v=20261008c">
<link rel="stylesheet" href="css/admin.css?v=20261008c">
</head>
<body class="admin">
<header class="topbar"><div class="tb-brand"><span class="eyebrow">安定區</span><b>QR-Code 驗收文件驗證</b></div><a class="small" href="./" style="margin-left:auto">回到道路圖資系統</a></header>
<main class="page-view" style="max-width:820px">
  <form class="card" id="codeForm">
    <h2>輸入或掃描驗收碼</h2>
    <p class="muted">施工照片文件上的 QR-Code 會帶您到此頁。系統會取出資料庫中的<b>原始照片</b>並重新計算數位指紋，請與手上文件逐張比對。</p>
    <div class="filter-row"><input id="code" maxlength="10" placeholder="10 碼驗收碼" autocapitalize="characters" style="flex:1;border:2px solid var(--ink);border-radius:10px;padding:9px 12px;font-size:18px;letter-spacing:.15em"><button class="btn primary" type="submit">驗證</button></div>
  </form>
  <div id="result"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="js/config.js?v=20261008c"></script>
<script src="js/common.js?v=20261008c"></script>
<script src="js/verify.js?v=20261008c"></script>
</body>
</html>
